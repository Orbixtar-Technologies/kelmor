        "200": { description: account list export }
  /audit-events:
    get:
      operationId: listAuditEvents
      x-capability: security.audit.read
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: account_id, in: query, schema: { type: string, format: uuid } }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: success, in: query, schema: { type: boolean } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: filtered audit trail with total, limit, and offset }
        "400": { description: invalid filter value }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: panel_session
  parameters:
    accountID:
      in: path
      name: accountID
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: structured error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    UpdateStatus:
      type: object
      additionalProperties: false
      required: [state, installed_release, automatic, channel]
      properties:
        state: { type: string }
        installed_release: { type: string }
        available_release: { type: string }
        last_checked_at: { type: string, format: date-time }
        error: { type: string }
        automatic: { type: boolean }
        channel: { type: string }
    PanelUpdateResult:
      type: object
      additionalProperties: false
      required: [ok, message, observed_state]
      properties:
        ok: { type: boolean }
        message: { type: string }
        observed_state: { type: string }
    Job:
      type: object
      required: [id, type, payload, state, retryable]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        resource_type: { type: string }
        resource_id: { type: string, format: uuid }
        payload: { type: object, description: Credential-redacted stored input }
        state: { type: string }
        retryable:
          type: boolean
          description: True only when the job type supports retry and its stored payload contains no sensitive fields.
    APIError:
      type: object
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details: { type: object }
