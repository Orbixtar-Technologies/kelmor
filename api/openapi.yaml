openapi: 3.1.0
info:
  title: Kelmor Control Plane API
  version: 0.1.0
  description: Desired-state Kelmor control plane (Director admin and Control tenant). Server endpoints require server-scoped capabilities. Account tokens are never valid for server-admin operations.
servers:
  - url: /api/v1
paths:
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      responses:
        "200": { description: OpenAPI 3 document }
  /healthz:
    get:
      operationId: healthz
      responses:
        "200": { description: liveness }
  /readyz:
    get:
      operationId: readyz
      responses:
        "200": { description: readiness }
  /version:
    get:
      operationId: getVersion
      responses:
        "200": { description: control-plane version }
  /auth/login:
    post:
      operationId: login
      x-audit-action: auth.login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200": { description: session issued }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200": { description: session revoked }
  /auth/refresh:
    post:
      operationId: refreshSession
      responses:
        "200": { description: session extended }
  /me:
    get:
      operationId: getMe
      responses:
        "200": { description: current actor }
  /server:
    get:
      operationId: getServer
      x-capability: server.read
      responses:
        "200": { description: host metrics and service health }
  /server/firewall:
    get:
      operationId: getFirewall
      x-capability: server.firewall.read
      responses:
        "200": { description: nftables table inet panel metadata }
  /server/firewall/apply:
    post:
      operationId: applyFirewall
      x-capability: server.firewall.write
      x-audit-action: server.firewall.apply
      responses:
        "200": { description: table inet panel applied }
  /server/monitor:
    get:
      operationId: serverMonitor
      x-capability: server.read
      responses:
        "200": { description: per-account disk, bandwidth, inode, and process usage }
  /server/services:
    get:
      operationId: serverServices
      x-capability: server.services.read
      responses:
        "200": { description: host service probes }
  /server/reboot:
    post:
      operationId: rebootHost
      x-capability: server.settings.write
      x-audit-action: server.reboot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, enum: [REBOOT] }
      responses:
        "202": { description: reboot recorded; live shutdown only with PANEL_ALLOW_REBOOT=1 }
        "400": { description: confirm missing }
  /packages:
    get:
      operationId: listPackages
      x-capability: packages.read
      responses:
        "200": { description: hosting plans }
    post:
      operationId: createPackage
      x-capability: packages.write
      x-audit-action: package.create
      responses:
        "201": { description: created }
  /packages/{packageID}:
    parameters:
      - $ref: "#/components/parameters/packageID"
    get:
      operationId: getPackage
      x-capability: packages.read
      responses:
        "200": { description: package }
        "404": { description: unknown, or owned by another reseller }
    put:
      operationId: updatePackage
      x-capability: packages.write
      x-audit-action: package.modify
      description: Replaces every limit on the package. Reseller ownership is preserved from the stored record.
      responses:
        "200": { description: saved }
        "404": { description: unknown, or owned by another reseller }
    delete:
      operationId: deletePackage
      x-capability: packages.write
      x-audit-action: package.delete
      responses:
        "200": { description: deleted }
        "409": { description: an account still uses this package }
  /feature-sets:
    get:
      operationId: listFeatureSets
      x-capability: packages.read
      responses:
        "200": { description: feature sets available to packages }
  /resellers:
    get:
      operationId: listResellers
      x-capability: resellers.read
      responses:
        "200": { description: resellers }
    post:
      operationId: createReseller
      x-capability: resellers.create
      responses:
        "201": { description: created }
  /resellers/{resellerID}:
    parameters:
      - in: path
        name: resellerID
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getReseller
      x-capability: resellers.read
      description: Reseller record with the accounts and packages it owns and its sign-in user.
      responses:
        "200": { description: reseller detail }
        "404": { description: unknown reseller }
    patch:
      operationId: updateReseller
      x-capability: resellers.modify
      x-audit-action: reseller.modify
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                brand_name: { type: string }
                status: { type: string, enum: [active, suspended] }
                nameservers: { type: array, items: { type: string } }
                privilege_mask:
                  type: array
                  description: Capabilities delegated to this reseller. Must be a subset of the reseller role.
                  items: { type: string }
      responses:
        "200": { description: saved }
        "400": { description: a privilege outside the reseller role was requested }
  /accounts:
    post:
      operationId: createAccount
      x-capability: accounts.create
      x-idempotency: required
      x-audit-action: account.create
      responses:
        "202": { description: provisioning job accepted }
    get:
      operationId: listAccounts
      x-capability: accounts.read
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: package_id
          schema: { type: string, format: uuid }
        - in: query
          name: reseller_id
          schema: { type: string, format: uuid }
        - in: query
          name: over_quota
          description: Only accounts at or above their package disk or monthly transfer limit.
          schema: { type: string, enum: ["true"] }
      responses:
        "200":
          description: >-
            Accounts the caller may see, with `total` and a `usage` map keyed by account id so an
            operator table can render disk and transfer without a request per row.
  /accounts/{accountID}:
    get:
      operationId: getAccount
      x-capability: accounts.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: account }
    patch:
      operationId: modifyAccount
      x-capability: accounts.modify
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: reconcile queued }
  /accounts/{accountID}/suspend:
    post:
      operationId: suspendAccount
      x-capability: accounts.suspend
      x-audit-action: account.suspend
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: reconcile queued }
  /accounts/{accountID}/unsuspend:
    post:
      operationId: unsuspendAccount
      x-capability: accounts.suspend
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: queued }
  /accounts/{accountID}/migrate:
    post:
      operationId: migrateAccount
      x-capability: accounts.create
      x-audit-action: account.migrate
      parameters:
        - $ref: "#/components/parameters/accountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, domain]
              properties:
                username: { type: string }
                domain: { type: string }
      responses:
        "202": { description: import and homedir copy queued }
  /accounts/{accountID}/usage:
    get:
      operationId: accountUsage
      x-capability: billing.usage.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: latest disk, bandwidth, and process usage }
  /accounts/{accountID}/impersonate:
    post:
      operationId: impersonateAccount
      x-capability: accounts.impersonate
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: tenant session issued }
  /accounts/{accountID}/cron:
    get:
      operationId: listCron
      x-capability: cron.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: cron jobs }
    post:
      operationId: createCron
      x-capability: cron.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: cron apply queued }
  /accounts/{accountID}/cron/{cronID}:
    delete:
      operationId: deleteCron
      x-capability: cron.write
      parameters:
        - $ref: "#/components/parameters/accountID"
        - { name: cronID, in: path, required: true, schema: { type: string } }
      responses:
        "202": { description: cron removed and crontab reapplied }
  /accounts/{accountID}/applications:
    get:
      operationId: listApplications
      x-capability: applications.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: application instances }
    post:
      operationId: createApplication
      x-capability: applications.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: application deploy queued }
  /accounts/{accountID}/applications/{applicationID}:
    delete:
      operationId: deleteApplication
      x-capability: applications.write
      parameters:
        - $ref: "#/components/parameters/accountID"
        - { name: applicationID, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: application removed }
  /accounts/{accountID}/terminate:
    post:
      operationId: terminateAccount
      x-capability: accounts.terminate
      x-audit-action: account.terminate
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: retire queued }
  /accounts/{accountID}/password:
    post:
      operationId: setAccountPassword
      x-capability: accounts.modify
      x-audit-action: account.password.reset
      description: Rotates the account owner password and the SFTP credential, optionally forcing a change at next sign-in.
      parameters:
        - $ref: "#/components/parameters/accountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                must_change_password: { type: boolean }
      responses:
        "202": { description: password rotated and reconcile queued }
        "400": { description: a new password is required }
  /accounts/{accountID}/domains:
    get:
      operationId: listDomains
      x-capability: domains.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: domains }
    post:
      operationId: createDomain
      x-capability: domains.write
      x-audit-action: domain.create
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: queued }
        "403": { description: package domain limit exceeded }
  /accounts/{accountID}/domains/{domainID}:
    delete:
      operationId: deleteDomain
      x-capability: domains.write
      x-audit-action: domain.delete
      parameters:
        - $ref: "#/components/parameters/accountID"
        - name: domainID
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: retire queued }
        "409": { description: primary domain }
  /accounts/{accountID}/websites:
    get:
      operationId: listWebsites
      x-capability: websites.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: websites }
    post:
      operationId: createWebsite
      x-capability: websites.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: queued }
  /accounts/{accountID}/websites/{websiteID}:
    delete:
      operationId: deleteWebsite
      x-capability: websites.write
      x-audit-action: website.delete
      parameters:
        - $ref: "#/components/parameters/accountID"
        - name: websiteID
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: retire queued }
        "409": { description: primary domain website }
  /accounts/{accountID}/wordpress:
    post:
      operationId: installWordPress
      x-capability: applications.write
      x-audit-action: wordpress.install
      parameters:
        - $ref: "#/components/parameters/accountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [website_id, admin_user, admin_password, admin_email]
              properties:
                website_id: { type: string }
                title: { type: string }
                admin_user: { type: string }
                admin_password: { type: string }
                admin_email: { type: string }
      responses:
        "202": { description: WordPress install queued }
        "403": { description: package application limit exceeded }
  /accounts/{accountID}/databases:
    get:
      operationId: listDatabases
      x-capability: databases.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: databases }
    post:
      operationId: createDatabase
      x-capability: databases.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: queued }
        "403": { description: package database limit exceeded }
  /accounts/{accountID}/databases/{databaseID}:
    delete:
      operationId: deleteDatabase
      x-capability: databases.write
      parameters:
        - $ref: "#/components/parameters/accountID"
        - name: databaseID
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: drop queued }
  /accounts/{accountID}/mail/mailboxes:
    get:
      operationId: listMailboxes
      x-capability: mail.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: mailboxes }
    post:
      operationId: createMailbox
      x-capability: mail.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: queued }
        "403": { description: package mailbox limit exceeded }
  /accounts/{accountID}/mail/mailboxes/{mailboxID}:
    delete:
      operationId: deleteMailbox
      x-capability: mail.write
      parameters:
        - $ref: "#/components/parameters/accountID"
        - name: mailboxID
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: mailbox removed and maps queued }
        "409": { description: mailbox is an alias destination }
  /accounts/{accountID}/mail/aliases:
    get:
      operationId: listMailAliases
      x-capability: mail.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: virtual aliases }
    post:
      operationId: createMailAlias
      x-capability: mail.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain_id, address, destination]
              properties:
                domain_id: { type: string }
                address: { type: string }
                destination: { type: string }
      responses:
        "202": { description: alias stored and maps queued }
  /accounts/{accountID}/mail/aliases/{aliasID}:
    delete:
      operationId: deleteMailAlias
      x-capability: mail.write
      parameters:
        - $ref: "#/components/parameters/accountID"
        - name: aliasID
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: alias removed and maps queued }
  /jobs:
    get:
      operationId: listJobs
      responses:
        "200": { description: durable job queue }
  /server/dns/zones:
    get:
      operationId: listAllZones
      x-capability: dns.read
      description: Server-wide authoritative zone index joined with the owning account and its record count.
      responses:
        "200": { description: zones served by this host }
  /accounts/{accountID}/mail/domains:
    get:
      operationId: listMailDomains
      x-capability: mail.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: mail domains }
  /accounts/{accountID}/mail/domains/{mailDomainID}:
    patch:
      operationId: patchMailDomain
      x-capability: mail.write
      x-audit-action: mail.catchall
      parameters:
        - $ref: "#/components/parameters/accountID"
        - name: mailDomainID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [catchall_policy]
              properties:
                catchall_policy: { type: string, description: reject, discard, or mailbox local part }
      responses:
        "202": { description: mail maps queued }
  /accounts/import:
    post:
      operationId: importAccount
      x-capability: accounts.create
      parameters:
        - in: query
          name: username
          schema: { type: string }
        - in: query
          name: domain
          schema: { type: string }
      responses:
        "202": { description: reconcile queued }
  /accounts/import/cpanel:
    post:
      operationId: importCPanel
      x-capability: accounts.create
      x-audit-action: account.import.cpanel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root, username]
              properties:
                root: { type: string, description: Extracted cpmove tree }
                username: { type: string }
      responses:
        "202": { description: reconcile and CopyHomedir queued }
  /accounts/{accountID}/export:
    get:
      operationId: exportAccount
      x-capability: accounts.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: native hosting export }
  /accounts/{accountID}/files:
    get:
      operationId: listFiles
      x-capability: files.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: directory listing }
    post:
      operationId: writeFile
      x-capability: files.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: written via agent }
        "403": { description: package disk quota exceeded }
  /accounts/{accountID}/sftp-password:
    post:
      operationId: setSFTPPassword
      x-capability: files.write
      x-audit-action: account.sftp_password
      parameters:
        - $ref: "#/components/parameters/accountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200": { description: linux password set for chrooted SFTP }
  /accounts/{accountID}/ftp:
    get:
      operationId: listFTP
      x-capability: files.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: virtual FTP users }
    post:
      operationId: createFTP
      x-capability: files.write
      x-audit-action: ftp.create
      parameters:
        - $ref: "#/components/parameters/accountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                home_path: { type: string }
      responses:
        "202": { description: vsftpd maps queued }
        "403": { description: package ftp_users exceeded }
        "409": { description: username taken }
  /accounts/{accountID}/ftp/{ftpID}:
    delete:
      operationId: deleteFTP
      x-capability: files.write
      x-audit-action: ftp.delete
      parameters:
        - $ref: "#/components/parameters/accountID"
        - name: ftpID
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: user removed and maps queued }
  /accounts/{accountID}/restores:
    post:
      operationId: restoreBackup
      x-capability: backups.restore
      parameters:
        - $ref: "#/components/parameters/accountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backup_id]
              properties:
                backup_id: { type: string }
                mode: { type: string, enum: [in_place] }
      responses:
        "202": { description: restore queued }
  /accounts/{accountID}/dns/zones:
    get:
      operationId: listDNSZones
      x-capability: dns.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: zones }
  /accounts/{accountID}/dns/zones/{zoneID}/dnssec:
    post:
      operationId: setDNSSEC
      x-capability: dns.write
      x-audit-action: dns.dnssec
      parameters:
        - $ref: "#/components/parameters/accountID"
        - in: path
          name: zoneID
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "202": { description: DNSSEC job queued }
  /accounts/{accountID}/dns/zones/{zoneID}/ds:
    get:
      operationId: getDSRecords
      x-capability: dns.read
      parameters:
        - $ref: "#/components/parameters/accountID"
        - in: path
          name: zoneID
          required: true
          schema: { type: string }
      responses:
        "200": { description: DS records for the parent zone }
  /accounts/{accountID}/dns/zones/{zoneID}/records:
    get:
      operationId: listDNSRecords
      x-capability: dns.read
      parameters:
        - $ref: "#/components/parameters/accountID"
        - in: path
          name: zoneID
          required: true
          schema: { type: string }
      responses:
        "200": { description: records }
    post:
      operationId: createDNSRecord
      x-capability: dns.write
      parameters:
        - $ref: "#/components/parameters/accountID"
        - in: path
          name: zoneID
          required: true
          schema: { type: string }
      responses:
        "202": { description: record stored and zone sync queued }
  /accounts/{accountID}/dns/zones/{zoneID}/records/{recordID}:
    delete:
      operationId: deleteDNSRecord
      x-capability: dns.write
      x-audit-action: dns.record.delete
      parameters:
        - $ref: "#/components/parameters/accountID"
        - in: path
          name: zoneID
          required: true
          schema: { type: string }
        - in: path
          name: recordID
          required: true
          schema: { type: string }
      responses:
        "202": { description: record deleted and zone sync queued }
        "404": { description: zone or record missing }
  /accounts/{accountID}/certificates:
    get:
      operationId: listCertificates
      x-capability: websites.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: certificates }
    post:
      operationId: requestCertificate
      x-capability: websites.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: ACME or dev certificate queued }
  /accounts/{accountID}/backups:
    get:
      operationId: listBackups
      x-capability: backups.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: backups }
    post:
      operationId: createBackup
      x-capability: backups.create
      parameters:
        - $ref: "#/components/parameters/accountID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [full] }
                destination: { type: string, enum: [local, sftp, s3] }
      responses:
        "202": { description: queued }
  /accounts/{accountID}/ssh-keys:
    get:
      operationId: listSSHKeys
      x-capability: files.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: authorized SSH public keys }
    post:
      operationId: createSSHKey
      x-capability: files.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              properties:
                public_key: { type: string }
                label: { type: string }
                comment: { type: string, description: "Alias for label" }
      responses:
        "201": { description: key stored and authorized_keys applied }
  /accounts/{accountID}/ssh-keys/{keyID}:
    delete:
      operationId: deleteSSHKey
      x-capability: files.write
      parameters:
        - $ref: "#/components/parameters/accountID"
        - name: keyID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: key removed and authorized_keys applied }
  /accounts/{accountID}/api-tokens:
    get:
      operationId: listAPITokens
      x-capability: api_tokens.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: tokens }
    post:
      operationId: createAPIToken
      x-capability: api_tokens.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "201": { description: token issued once }
  /accounts/{accountID}/api-tokens/{tokenID}:
    delete:
      operationId: deleteAPIToken
      x-capability: api_tokens.write
      parameters:
        - $ref: "#/components/parameters/accountID"
        - { name: tokenID, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: token revoked }
  /server/processes:
    get:
      operationId: serverProcesses
      x-capability: server.read
      responses:
        "200": { description: host process snapshot }
  /accounts/bulk/suspend:
    post:
      operationId: bulkSuspend
      x-capability: accounts.suspend
      responses:
        "202": { description: suspend jobs queued }
  /accounts/export:
    get:
      operationId: exportAccounts
      x-capability: accounts.read
      responses:
        "200": { description: account list export }
  /jobs/{jobID}:
    get:
      operationId: getJob
      parameters:
        - in: path
          name: jobID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: job status }
  /jobs/{jobID}/retry:
    post:
      operationId: retryJob
      x-audit-action: job.retry
      description: Re-queues a failed, cancelled or dead job and clears its last error.
      parameters:
        - $ref: "#/components/parameters/jobID"
      responses:
        "202": { description: job re-queued }
        "409": { description: only failed or cancelled jobs can be retried }
  /jobs/{jobID}/cancel:
    post:
      operationId: cancelJob
      x-audit-action: job.cancel
      parameters:
        - $ref: "#/components/parameters/jobID"
      responses:
        "200": { description: job cancelled }
        "409": { description: only queued or failed jobs can be cancelled }
  /audit-events:
    get:
      operationId: listAuditEvents
      x-capability: security.audit.read
      parameters:
        - { in: query, name: q, schema: { type: string }, description: matches action, resource, source IP, request ID or actor }
        - { in: query, name: action, schema: { type: string }, description: substring match on the action }
        - { in: query, name: resource_type, schema: { type: string } }
        - { in: query, name: account_id, schema: { type: string, format: uuid } }
        - { in: query, name: actor_id, schema: { type: string, format: uuid } }
        - { in: query, name: success, schema: { type: string, enum: ["true", "false"] } }
        - { in: query, name: since, schema: { type: string, format: date-time } }
        - { in: query, name: until, schema: { type: string, format: date-time } }
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 500 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: filtered audit trail with total, offset and limit }
components:
  parameters:
    accountID:
      in: path
      name: accountID
      required: true
      schema: { type: string, format: uuid }
    packageID:
      in: path
      name: packageID
      required: true
      schema: { type: string, format: uuid }
    jobID:
      in: path
      name: jobID
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: structured error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    APIError:
      type: object
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details: { type: object }
