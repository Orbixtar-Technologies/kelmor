openapi: 3.1.0
info:
  title: Kelmor Control Plane API
  version: 0.1.0
  description: Desired-state Kelmor control plane (Director admin and Control tenant). Server endpoints require server-scoped capabilities. Account tokens are never valid for server-admin operations.
servers:
  - url: /api/v1
paths:
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      responses:
        "200": { description: OpenAPI 3 document }
  /healthz:
    get:
      operationId: healthz
      responses:
        "200": { description: liveness }
  /readyz:
    get:
      operationId: readyz
      responses:
        "200": { description: readiness }
  /version:
    get:
      operationId: getVersion
      responses:
        "200": { description: control-plane version }
  /auth/login:
    post:
      operationId: login
      x-audit-action: auth.login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200": { description: session issued }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/complete-password-change:
    post:
      operationId: completePasswordChange
      x-audit-action: auth.password.complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, current_password, new_password]
              properties:
                username: { type: string }
                current_password: { type: string, writeOnly: true }
                new_password: { type: string, minLength: 12, writeOnly: true }
      responses:
        "200": { description: password changed and Linux reconciliation queued }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200": { description: session revoked }
  /auth/refresh:
    post:
      operationId: refreshSession
      responses:
        "200": { description: session extended }
  /me:
    get:
      operationId: getMe
      responses:
        "200": { description: current actor }
  /server:
    get:
      operationId: getServer
      x-capability: server.read
      responses:
        "200": { description: host metrics and service health }
  /server/updates:
    get:
      operationId: getServerUpdates
      x-capability: server.read
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Fixed-path updater status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /server/updates/check:
    post:
      operationId: checkServerUpdates
      x-capability: server.settings.write
      x-server-scope: true
      x-audit-action: server.update.check
      description: Starts the configured update checker. This operation accepts no caller-supplied update configuration.
      security:
        - bearerAuth: []
      responses:
        "202":
          description: configured update check accepted asynchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelUpdateResult"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /server/updates/install:
    post:
      operationId: installServerUpdate
      x-capability: server.settings.write
      x-server-scope: true
      x-audit-action: server.update.install
      description: Starts installation of the already verified configured release. This operation accepts no caller-supplied update configuration.
      security:
        - bearerAuth: []
      responses:
        "202":
          description: configured update installation accepted asynchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelUpdateResult"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /server/updates/settings:
    patch:
      operationId: updateServerUpdateSettings
      x-capability: server.settings.write
      x-server-scope: true
      x-audit-action: server.update.settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [automatic]
              properties:
                automatic: { type: boolean }
      responses:
        "200":
          description: automatic update setting changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelUpdateResult"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /server/firewall:
    get:
      operationId: getFirewall
      x-capability: server.firewall.read
      responses:
        "200": { description: nftables table inet panel metadata }
  /server/firewall/apply:
    post:
      operationId: applyFirewall
      x-capability: server.firewall.write
      x-audit-action: server.firewall.apply
      responses:
        "200": { description: table inet panel applied }
  /server/monitor:
    get:
      operationId: serverMonitor
      x-capability: server.read
      responses:
        "200": { description: per-account disk, bandwidth, inode, and process usage }
  /server/dns/zones:
    get:
      operationId: listServerDNSZones
      x-capability: server.read
      responses:
        "200": { description: server-wide zones joined to account usernames and record counts }
  /server/services:
    get:
      operationId: serverServices
      x-capability: server.services.read
      responses:
        "200": { description: host service probes }
  /server/reboot:
    post:
      operationId: rebootHost
      x-capability: server.settings.write
      x-audit-action: server.reboot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, enum: [REBOOT] }
      responses:
        "202": { description: reboot recorded; live shutdown only with PANEL_ALLOW_REBOOT=1 }
        "400": { description: confirm missing }
  /packages:
    get:
      operationId: listPackages
      x-capability: packages.read
      responses:
        "200": { description: hosting plans }
    post:
      operationId: createPackage
      x-capability: packages.write
      x-audit-action: package.create
      responses:
        "201": { description: created }
  /packages/{packageID}:
    get:
      operationId: getPackage
      x-capability: packages.read
      parameters:
        - { name: packageID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: package visible to the actor }
        "404": { description: package not found or outside reseller scope }
    put:
      operationId: replacePackage
      x-capability: packages.write
      x-audit-action: package.update
      parameters:
        - { name: packageID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: package fully replaced while retaining immutable ownership }
        "403": { description: package is outside the actor scope }
        "404": { description: package not found }
    patch:
      operationId: updatePackage
      x-capability: packages.write
      x-audit-action: package.update
      parameters:
        - { name: packageID, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: package updated }
        "403": { description: package is outside the actor scope }
        "404": { description: package not found }
    delete:
      operationId: deletePackage
      x-capability: packages.write
      x-audit-action: package.delete
      parameters:
        - { name: packageID, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: package deleted }
        "409": { description: package is assigned to an account }
  /feature-sets:
    get:
      operationId: listFeatureSets
      x-capability: packages.read
      responses:
        "200": { description: available package feature sets }
  /resellers:
    get:
      operationId: listResellers
      x-capability: resellers.read
      responses:
        "200": { description: resellers }
    post:
      operationId: createReseller
      x-capability: resellers.create
      responses:
        "201": { description: created }
  /resellers/{resellerID}:
    get:
      operationId: getReseller
      x-capability: resellers.read
      description: Server-scoped reseller detail with owned accounts, packages, and a credential-safe owner identity.
      parameters:
        - { name: resellerID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: reseller detail }
        "403": { description: server scope required }
        "404": { description: reseller not found }
    patch:
      operationId: updateReseller
      x-capability: resellers.modify
      x-audit-action: reseller.update
      parameters:
        - { name: resellerID, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                brand_name: { type: string }
                status: { type: string, enum: [active, suspended, inactive] }
                nameservers:
                  type: array
                  items: { type: string, format: hostname }
                privilege_mask:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: reseller updated }
        "403": { description: server scope required }
        "404": { description: reseller not found }
  /accounts:
    post:
      operationId: createAccount
      x-capability: accounts.create
      x-idempotency: required
      x-audit-action: account.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, primary_domain, package_id, owner_password]
              properties:
                username: { type: string, minLength: 3, maxLength: 32 }
                primary_domain: { type: string, format: hostname }
                package_id: { type: string, format: uuid }
                reseller_id: { type: string, format: uuid }
                owner_email: { type: string, format: email, description: Defaults to username@normalized-primary-domain when omitted or blank. }
                owner_password: { type: string, format: password, minLength: 12, writeOnly: true }
      responses:
        "202": { description: provisioning job accepted }
        "400": { description: invalid account request or owner password }
    get:
      operationId: listAccounts
      x-capability: accounts.read
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: package_id
          schema: { type: string, format: uuid }
        - in: query
          name: reseller_id
          schema: { type: string, format: uuid }
        - in: query
          name: over_quota
          schema: { type: boolean }
      responses:
        "200": { description: visible accounts with total and a usage map keyed only by visible account IDs }
        "400": { description: invalid filter value }
  /accounts/{accountID}:
    get:
      operationId: getAccount
      x-capability: accounts.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: account }
    patch:
      operationId: modifyAccount
      x-capability: accounts.modify
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: reconcile queued }
  /accounts/{accountID}/suspend:
    post:
      operationId: suspendAccount
      x-capability: accounts.suspend
      x-audit-action: account.suspend
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: reconcile queued }
  /accounts/{accountID}/unsuspend:
    post:
      operationId: unsuspendAccount
      x-capability: accounts.suspend
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: queued }
  /accounts/{accountID}/password:
    post:
      operationId: rotateAccountPassword
      x-capability: accounts.modify
      x-audit-action: account.password.rotate
      parameters:
        - $ref: "#/components/parameters/accountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 12, writeOnly: true }
                must_change_password: { type: boolean, default: false }
      responses:
        "202": { description: owner password updated and Linux reconciliation queued }
  /accounts/{accountID}/migrate:
    post:
      operationId: migrateAccount
      x-capability: accounts.create
      x-audit-action: account.migrate
      parameters:
        - $ref: "#/components/parameters/accountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, domain]
              properties:
                username: { type: string }
                domain: { type: string }
      responses:
        "202": { description: import and homedir copy queued }
  /accounts/{accountID}/usage:
    get:
      operationId: accountUsage
      x-capability: billing.usage.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: latest disk, bandwidth, and process usage }
  /accounts/{accountID}/impersonate:
    post:
      operationId: impersonateAccount
      x-capability: accounts.impersonate
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: tenant session issued }
  /accounts/{accountID}/cron:
    get:
      operationId: listCron
      x-capability: cron.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: cron jobs }
    post:
      operationId: createCron
      x-capability: cron.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: cron apply queued }
  /accounts/{accountID}/cron/{cronID}:
    delete:
      operationId: deleteCron
      x-capability: cron.write
      parameters:
        - $ref: "#/components/parameters/accountID"
        - { name: cronID, in: path, required: true, schema: { type: string } }
      responses:
        "202": { description: cron removed and crontab reapplied }
  /accounts/{accountID}/applications:
    get:
      operationId: listApplications
      x-capability: applications.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: application instances }
    post:
      operationId: createApplication
      x-capability: applications.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: application deploy queued }
  /accounts/{accountID}/applications/{applicationID}:
    delete:
      operationId: deleteApplication
      x-capability: applications.write
      parameters:
        - $ref: "#/components/parameters/accountID"
        - { name: applicationID, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: application removed }
  /accounts/{accountID}/terminate:
    post:
      operationId: terminateAccount
      x-capability: accounts.terminate
      x-audit-action: account.terminate
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: retire queued }
  /accounts/{accountID}/domains:
    get:
      operationId: listDomains
      x-capability: domains.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: domains }
    post:
      operationId: createDomain
      x-capability: domains.write
      x-audit-action: domain.create
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: queued }
        "403": { description: package domain limit exceeded }
  /accounts/{accountID}/domains/{domainID}:
    delete:
      operationId: deleteDomain
      x-capability: domains.write
      x-audit-action: domain.delete
      parameters:
        - $ref: "#/components/parameters/accountID"
        - name: domainID
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: retire queued }
        "409": { description: primary domain }
  /accounts/{accountID}/websites:
    get:
      operationId: listWebsites
      x-capability: websites.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: websites }
    post:
      operationId: createWebsite
      x-capability: websites.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: queued }
  /accounts/{accountID}/websites/{websiteID}:
    delete:
      operationId: deleteWebsite
      x-capability: websites.write
      x-audit-action: website.delete
      parameters:
        - $ref: "#/components/parameters/accountID"
        - name: websiteID
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: retire queued }
        "409": { description: primary domain website }
  /accounts/{accountID}/wordpress:
    post:
      operationId: installWordPress
      x-capability: applications.write
      x-audit-action: wordpress.install
      parameters:
        - $ref: "#/components/parameters/accountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [website_id, admin_user, admin_password, admin_email]
              properties:
                website_id: { type: string }
                title: { type: string }
                admin_user: { type: string }
                admin_password: { type: string }
                admin_email: { type: string }
      responses:
        "202": { description: WordPress install queued }
        "403": { description: package application limit exceeded }
  /accounts/{accountID}/databases:
    get:
      operationId: listDatabases
      x-capability: databases.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: databases }
    post:
      operationId: createDatabase
      x-capability: databases.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: queued }
        "403": { description: package database limit exceeded }
  /accounts/{accountID}/databases/{databaseID}:
    delete:
      operationId: deleteDatabase
      x-capability: databases.write
      parameters:
        - $ref: "#/components/parameters/accountID"
        - name: databaseID
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: drop queued }
  /accounts/{accountID}/mail/mailboxes:
    get:
      operationId: listMailboxes
      x-capability: mail.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: mailboxes }
    post:
      operationId: createMailbox
      x-capability: mail.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "202": { description: queued }
        "403": { description: package mailbox limit exceeded }
  /accounts/{accountID}/mail/mailboxes/{mailboxID}:
    delete:
      operationId: deleteMailbox
      x-capability: mail.write
      parameters:
        - $ref: "#/components/parameters/accountID"
        - name: mailboxID
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: mailbox removed and maps queued }
        "409": { description: mailbox is an alias destination }
  /accounts/{accountID}/mail/aliases:
    get:
      operationId: listMailAliases
      x-capability: mail.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: virtual aliases }
    post:
      operationId: createMailAlias
      x-capability: mail.write
      parameters:
        - $ref: "#/components/parameters/accountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain_id, address, destination]
              properties:
                domain_id: { type: string }
                address: { type: string }
                destination: { type: string }
      responses:
        "202": { description: alias stored and maps queued }
  /accounts/{accountID}/mail/aliases/{aliasID}:
    delete:
      operationId: deleteMailAlias
      x-capability: mail.write
      parameters:
        - $ref: "#/components/parameters/accountID"
        - name: aliasID
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: alias removed and maps queued }
  /jobs:
    get:
      operationId: listJobs
      responses:
        "200": { description: durable job queue }
  /jobs/{jobID}:
    get:
      operationId: getJob
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Credential-redacted job detail. `retryable` reports whether the stored job type and payload are safe to clone for retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404": { description: job not found or outside the actor scope }
  /jobs/{jobID}/retry:
    post:
      operationId: retryJob
      x-audit-action: job.retry
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string } }
      responses:
        "202": { description: eligible failed job cloned into a new queued operation }
        "403": { description: missing capability for the job operation }
        "409": { description: job is not failed or its type is not retryable }
  /jobs/{jobID}/cancel:
    post:
      operationId: cancelJob
      x-audit-action: job.cancel
      description: Atomically cancels a visible queued or failed job. Requires the write capability for that job type; server.read alone is insufficient.
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: credential-redacted cancelled job }
        "403": { description: missing capability for the job operation }
        "404": { description: job not found or outside the actor scope }
        "409": { description: job is running, succeeded, cancelled, or otherwise not cancellable }
  /accounts/{accountID}/mail/domains:
    get:
      operationId: listMailDomains
      x-capability: mail.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: mail domains }
  /accounts/{accountID}/mail/domains/{mailDomainID}:
    patch:
      operationId: patchMailDomain
      x-capability: mail.write
      x-audit-action: mail.catchall
      parameters:
        - $ref: "#/components/parameters/accountID"
        - name: mailDomainID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [catchall_policy]
              properties:
                catchall_policy: { type: string, description: reject, discard, or mailbox local part }
      responses:
        "202": { description: mail maps queued }
  /accounts/import:
    post:
      operationId: importAccount
      x-capability: accounts.create
      x-server-scope: true
      parameters:
        - in: query
          name: username
          schema: { type: string }
        - in: query
          name: domain
          schema: { type: string }
      responses:
        "202": { description: reconcile queued }
  /accounts/import/cpanel:
    post:
      operationId: importCPanel
      x-capability: accounts.create
      x-server-scope: true
      x-audit-action: account.import.cpanel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root, username]
              properties:
                root: { type: string, description: Extracted cpmove tree }
                username: { type: string }
      responses:
        "202": { description: reconcile and CopyHomedir queued }
  /accounts/{accountID}/export:
    get:
      operationId: exportAccount
      x-capability: accounts.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: native hosting export }
  /accounts/{accountID}/files:
    get:
      operationId: listFiles
      x-capability: files.read
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        "200": { description: directory listing }
    post:
      operationId: writeFile
