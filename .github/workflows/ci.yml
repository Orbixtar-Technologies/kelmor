name: ci
on:
  pull_request:
  push:
    branches: [main, release/**]
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: make lint
      - run: make test
      - run: make test-security
      - run: make build
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd portals/server && npm ci && npx tsc -b --pretty false
      - run: cd portals/account && npm ci && npx tsc -b --pretty false
