name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional explicit semver (e.g. 0.2.5). Leave empty to auto-compute.
        required: false
        type: string
      publish_feed:
        description: Publish signed feed to configured VM after build
        required: false
        default: false
        type: boolean

jobs:
  installer:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install portal dependencies
        run: make bootstrap

      - name: Resolve version
        id: version
        env:
          PANEL_UPDATE_RELEASE: ${{ inputs.release_version }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: echo "version=$(bash scripts/ci/resolve-release-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build GitHub installer
        env:
          PANEL_INSTALLER_VERSION: ${{ steps.version.outputs.version }}
        run: make installer

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kelmor-installer-${{ steps.version.outputs.version }}
          retention-days: 90
          path: |
            dist/installer/get-kelmor.sh
            dist/installer/kelmor-installer-linux-*.tar.gz
            dist/installer/kelmor-installer-linux-*.tar.gz.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Kelmor ${{ steps.version.outputs.version }}
          body: |
            Install on any Ubuntu 24.04 VM:

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/get-kelmor.sh | sudo bash
            ```
          files: |
            dist/installer/get-kelmor.sh
            dist/installer/kelmor-installer-linux-*.tar.gz
            dist/installer/kelmor-installer-linux-*.tar.gz.sha256
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true

  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install portal dependencies
        run: make bootstrap

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.PANEL_UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "PANEL_UPDATE_SIGNING_KEY secret is required for signed releases." >&2
            exit 1
          fi
          bash scripts/ci/prepare-signing-key.sh "$RUNNER_TEMP/signing/update-signing.priv"

      - name: Build, package, and sign update feed
        env:
          PANEL_UPDATE_SIGNING_KEY: ${{ runner.temp }}/signing/update-signing.priv
          PANEL_UPDATE_RELEASE: ${{ inputs.release_version }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bash scripts/ci/release.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kelmor-release-${{ github.run_number }}
          retention-days: 90
          path: |
            dist/deb/*.deb
            dist/update-feed/
            dist/release/release.env

      - name: Publish update feed to VM
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_feed == true }}
        env:
          PUBLISH_UPDATE_FEED: "true"
          VM_HOST: ${{ secrets.KELMOR_VM_HOST }}
          VM_USER: ${{ secrets.KELMOR_VM_USER }}
          VM_KEY_PATH: ${{ runner.temp }}/vm/ssh-key
          VM_PORT: ${{ secrets.KELMOR_VM_PORT }}
          PANEL_UPDATE_PUBLISH_URL: ${{ secrets.PANEL_UPDATE_PUBLISH_URL }}
          REQUIRE_FEED_PUBLISH: "true"
        run: |
          if [[ -n "${VM_HOST:-}" && -n "${{ secrets.KELMOR_VM_SSH_KEY }}" ]]; then
            install -d -m 700 "$RUNNER_TEMP/vm"
            printf '%s' "${{ secrets.KELMOR_VM_SSH_KEY }}" > "$VM_KEY_PATH"
            chmod 600 "$VM_KEY_PATH"
          fi
          bash scripts/ci/publish-update-feed.sh
